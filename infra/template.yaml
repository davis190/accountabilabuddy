AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Accountabilabuddy MVP — API, data, web delivery primitives

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
  AppOrigin:
    Type: String
    Default: https://accountabilabuddy.claytondavis.dev
  CognitoDomainPrefix:
    Type: String
    Default: abb-claytondavis-dev
  GoogleClientId:
    Type: String
    NoEcho: true
    Default: ''
  GoogleClientSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for Google OAuth client secret JSON {clientId,clientSecret}
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM cert in us-east-1 covering CloudFront aliases
  DomainAliases:
    Type: CommaDelimitedList
    Default: 'accountabilabuddy.claytondavis.dev,abb.claytondavis.dev,accountability.claytondavis.dev'
  SesFromEmail:
    Type: String
    Default: ''
  HostedZoneId:
    Type: String
    Default: ''

Conditions:
  HasGoogle: !And
    - !Not [!Equals [!Ref GoogleClientId, '']]
    - !Not [!Equals [!Ref GoogleClientSecretArn, '']]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasSes: !Not [!Equals [!Ref SesFromEmail, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 512
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        AUTH_MODE: cognito
        APP_ORIGIN: !Ref AppOrigin
        CORS_ORIGINS: !Sub
          - '${AppOrigin},https://abb.claytondavis.dev,https://accountability.claytondavis.dev,https://d2fkajdnlw927r.cloudfront.net,http://localhost:5173'
          - AppOrigin: !Ref AppOrigin
        TABLE_PREFIX: !Sub accountabilabuddy-${Environment}
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        COGNITO_REGION: !Ref AWS::Region
        SES_FROM_EMAIL: !Ref SesFromEmail
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

Resources:
  ########################
  # DynamoDB
  ########################
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub accountabilabuddy-${Environment}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: application
          Value: accountabilabuddy
        - Key: environment
          Value: !Ref Environment

  GroupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub accountabilabuddy-${Environment}-groups
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  MembershipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub accountabilabuddy-${Environment}-memberships
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: joinedAt
          AttributeType: S
      KeySchema:
        - AttributeName: groupId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: MembershipsByUser
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: joinedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  GoalsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub accountabilabuddy-${Environment}-goals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupUserKey
          AttributeType: S
        - AttributeName: goalId
          AttributeType: S
      KeySchema:
        - AttributeName: groupUserKey
          KeyType: HASH
        - AttributeName: goalId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CompletionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub accountabilabuddy-${Environment}-completions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupUserWeek
          AttributeType: S
        - AttributeName: localDateGoalId
          AttributeType: S
        - AttributeName: groupUserGoal
          AttributeType: S
        - AttributeName: localDate
          AttributeType: S
      KeySchema:
        - AttributeName: groupUserWeek
          KeyType: HASH
        - AttributeName: localDateGoalId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: CompletionsByGoal
          KeySchema:
            - AttributeName: groupUserGoal
              KeyType: HASH
            - AttributeName: localDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  WeeklySnapshotsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub accountabilabuddy-${Environment}-weekly-snapshots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: groupWeek
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: groupWeek
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  InvitationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub accountabilabuddy-${Environment}-invitations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: invitationId
          AttributeType: S
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: invitationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: InvitationsByTokenHash
          KeySchema:
            - AttributeName: tokenHash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  NotificationDeliveriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub accountabilabuddy-${Environment}-notification-deliveries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deliveryKey
          AttributeType: S
        - AttributeName: attempt
          AttributeType: N
      KeySchema:
        - AttributeName: deliveryKey
          KeyType: HASH
        - AttributeName: attempt
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ########################
  # Cognito
  ########################
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub accountabilabuddy-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Sub
          - '{{resolve:secretsmanager:${SecretArn}:SecretString:clientSecret}}'
          - SecretArn: !Ref GoogleClientSecretArn
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - GoogleIdentityProvider
    Properties:
      ClientName: !Sub accountabilabuddy-web-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO, Google]
      CallbackURLs:
        - !Sub ${AppOrigin}/auth/callback
        - https://abb.claytondavis.dev/auth/callback
        - https://accountability.claytondavis.dev/auth/callback
        - http://localhost:5173/auth/callback
      LogoutURLs:
        - !Ref AppOrigin
        - https://abb.claytondavis.dev/
        - https://accountability.claytondavis.dev/
        - http://localhost:5173/
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED

  ########################
  # API + Lambda
  ########################
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref AppOrigin
          - https://abb.claytondavis.dev
          - https://accountability.claytondavis.dev
          - https://d2fkajdnlw927r.cloudfront.net
          - http://localhost:5173
        AllowHeaders:
          - Authorization
          - Content-Type
          - Idempotency-Key
          - X-Request-Id
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowCredentials: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub accountabilabuddy-api-${Environment}
      CodeUri: ../.aws-sam/lambda-bundle/
      Handler: dist/lambda.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GroupsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MembershipsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GoalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CompletionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeeklySnapshotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InvitationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationDeliveriesTable
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          GROUPS_TABLE: !Ref GroupsTable
          MEMBERSHIPS_TABLE: !Ref MembershipsTable
          GOALS_TABLE: !Ref GoalsTable
          COMPLETIONS_TABLE: !Ref CompletionsTable
          WEEKLY_SNAPSHOTS_TABLE: !Ref WeeklySnapshotsTable
          INVITATIONS_TABLE: !Ref InvitationsTable
          NOTIFICATION_DELIVERIES_TABLE: !Ref NotificationDeliveriesTable

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/accountabilabuddy-api-${Environment}
      RetentionInDays: 30

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub accountabilabuddy-notifications-${Environment}
      CodeUri: ../.aws-sam/lambda-bundle/
      Handler: dist/lambda.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MembershipsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GroupsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CompletionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GoalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeeklySnapshotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationDeliveriesTable
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt NotificationDLQ.Arn

  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub accountabilabuddy-notification-dlq-${Environment}
      MessageRetentionPeriod: 1209600

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-notification-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NotificationFunction.Arn

  ########################
  # Static web
  ########################
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub accountabilabuddy-web-${Environment}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub accountabilabuddy-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub accountabilabuddy-security-${Environment}
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.execute-api.us-east-1.amazonaws.com https://*.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Aliases: !If
          - HasCertificate
          - !Ref DomainAliases
          - !Ref AWS::NoValue
        Origins:
          - Id: web-s3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: web-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate: !If
          - HasCertificate
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub accountabilabuddy-api-errors-${Environment}
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  HttpApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CloudFrontDomain:
    Value: !GetAtt WebDistribution.DomainName
  WebBucketName:
    Value: !Ref WebBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
