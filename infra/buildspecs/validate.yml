version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci
  build:
    commands:
      - npm run build -w @accountabilabuddy/shared
      - npm test
      - npm run typecheck
      - |
        if command -v cfn-lint >/dev/null 2>&1; then
          cfn-lint infra/template.yaml infra/pipeline.yaml || true
        else
          echo "cfn-lint not installed; skipping"
        fi
artifacts:
  files:
    - '**/*'
