version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - rm -rf node_modules
      - npm ci --ignore-scripts --include=dev
  build:
    commands:
      - npm run build -w @accountabilabuddy/shared
      - npm test
      - npm run typecheck
artifacts:
  files:
    - '**/*'
