version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      # Never reuse a prior node_modules; artifact zips break .bin symlinks (tsc → ../lib/tsc.js).
      - rm -rf node_modules
      - npm ci --ignore-scripts --include=dev
  build:
    commands:
      - npm run build
      - chmod +x scripts/package-lambda.sh
      - ./scripts/package-lambda.sh
      - find .aws-sam/lambda-bundle -type f | sort | sha256sum > .aws-sam/checksums.txt || true
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - node_modules/**/*
    - '**/node_modules/**/*'
  discard-paths: no
