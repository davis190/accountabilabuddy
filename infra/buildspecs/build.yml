version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install --ignore-scripts
  build:
    commands:
      - npm run build
      - chmod +x scripts/package-lambda.sh
      - ./scripts/package-lambda.sh
      - find .aws-sam/lambda-bundle -type f | sort | sha256sum > .aws-sam/checksums.txt || true
artifacts:
  files:
    - '**/*'
  discard-paths: no
